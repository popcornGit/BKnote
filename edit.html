<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑笔记 - BK专属笔记</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        .editor-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            align-items: center;
        }

        .editor-title {
            flex-grow: 1;
            font-size: 1.5rem;
            padding: 0.5rem;
            border: 2px solid #ddd;
            border-radius: 4px;
            margin-right: 1rem;
        }

        .ql-editor {
            min-height: 400px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .ql-container {
            border: 2px solid #ddd;
            border-radius: 4px;
        }

        .ql-toolbar {
            border: 2px solid #ddd !important;
            border-radius: 4px 4px 0 0 !important;
        }

        .save-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        .save-btn:hover {
            background: #0069d9;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            margin-right: 10px;
        }

        .back-btn:hover {
            background: #5a6268;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .note-info {
            color: #6c757d;
            margin-bottom: 1rem;
        }
        
        #imageUploadInput {
            display: none;
        }
        
        .toolbar-button {
            background: #f0f0f0;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            margin: 0 2px;
        }
        
        .toolbar-button:hover {
            background: #e0e0e0;
        }
        
        .tags-container {
            margin-bottom: 1rem;
        }
        
        .tags-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        
        .tag-input {
            flex-grow: 1;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        
        .tag-item {
            display: inline-block;
            background-color: #e3f2fd;
            color: #1976d2;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            font-size: 0.8rem;
            margin: 0 0.25rem 0.25rem 0;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #bbdefb;
        }
        
        .tag-item:hover {
            background-color: #bbdefb;
            transform: translateY(-1px);
        }
        
        .remove-tag {
            margin-left: 0.5rem;
            color: #f44336;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>BK专属笔记</h1>
        <p>一个简单易用的在线笔记工具</p>
    </header>

    <div class="editor-container">
        <a href="index.html" class="back-btn">返回列表</a>
        <button id="saveNote" class="save-btn">保存笔记</button>
        <button id="deleteNote" class="delete-btn">删除笔记</button>
        <button id="exportNote" class="save-btn" style="background: #28a745;">导出笔记</button>

        <div class="note-info">
            <small>创建时间: <span id="noteDate"></span></small>
        </div>

        <div class="editor-header">
            <input type="text" id="noteTitle" class="editor-title" placeholder="笔记标题">
        </div>

        <!-- 标签编辑区域 -->
        <div class="tags-container">
            <label for="tagInput"><strong>标签:</strong></label>
            <div class="tags-input-container">
                <input type="text" id="tagInput" class="tag-input" placeholder="输入标签，回车添加...">
                <div id="tagsList" class="tags-list"></div>
            </div>
        </div>

        <div id="toolbar">
            <span class="ql-formats">
                <select class="ql-header">
                    <option value="1">标题1</option>
                    <option value="2">标题2</option>
                    <option value="3">标题3</option>
                    <option value="4">标题4</option>
                    <option value="5">标题5</option>
                    <option value="6">标题6</option>
                    <option selected>正文</option>
                </select>
            </span>
            <span class="ql-formats">
                <button class="ql-bold"></button>
                <button class="ql-italic"></button>
                <button class="ql-underline"></button>
                <button class="ql-strike"></button>
            </span>
            <span class="ql-formats">
                <button class="ql-list" value="ordered"></button>
                <button class="ql-list" value="bullet"></button>
            </span>
            <span class="ql-formats">
                <button class="ql-link"></button>
                <button class="ql-image"></button>
                <button class="ql-video"></button>
            </span>
            <span class="ql-formats">
                <button class="ql-clean"></button>
            </span>
        </div>
        <div id="editor" style="border: 2px solid #ddd; border-radius: 4px; border-top: none;"></div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取URL参数中的笔记ID
            const urlParams = new URLSearchParams(window.location.search);
            const noteId = parseInt(urlParams.get('id'));

            if (!noteId) {
                alert('未找到笔记ID');
                window.location.href = 'index.html';
                return;
            }

            // 加载笔记数据
            let notes = JSON.parse(localStorage.getItem('notes')) || [];
            let note = notes.find(note => note.id === noteId);

            if (!note) {
                alert('未找到对应的笔记');
                window.location.href = 'index.html';
                return;
            }

            // 初始化Quill编辑器
            const quill = new Quill('#editor', {
                modules: {
                    toolbar: '#toolbar',
                },
                theme: 'snow'
            });

            // 显示笔记数据
            document.getElementById('noteTitle').value = note.title;
            quill.root.innerHTML = note.content;
            
            const date = new Date(note.date);
            document.getElementById('noteDate').textContent = date.toLocaleString();
            
            // 初始化标签功能
            const tagInput = document.getElementById('tagInput');
            const tagsList = document.getElementById('tagsList');
            
            // 如果笔记没有tags属性，初始化为空数组
            if (!note.hasOwnProperty('tags')) {
                note.tags = [];
            }
            
            // 渲染当前标签
            function renderTags() {
                tagsList.innerHTML = '';
                if (note.tags && note.tags.length > 0) {
                    note.tags.forEach(tag => {
                        const tagSpan = document.createElement('span');
                        tagSpan.className = 'tag-item';
                        tagSpan.innerHTML = `${tag} <span class="remove-tag" data-tag="${tag}">×</span>`;
                        tagsList.appendChild(tagSpan);
                    });
                    
                    // 为删除按钮添加事件
                    document.querySelectorAll('.remove-tag').forEach(removeBtn => {
                        removeBtn.addEventListener('click', function() {
                            const tagToRemove = this.getAttribute('data-tag');
                            note.tags = note.tags.filter(tag => tag !== tagToRemove);
                            renderTags();
                            updateNoteInStorage();
                        });
                    });
                } else {
                    tagsList.innerHTML = '<span class="no-tags">暂无标签</span>';
                }
            }
            
            // 添加标签
            function addTag(tag) {
                if (tag && !note.tags.includes(tag)) {
                    note.tags.push(tag);
                    renderTags();
                    updateNoteInStorage();
                    tagInput.value = '';
                }
            }
            
            // 输入框回车添加标签
            tagInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value.trim()) {
                    addTag(this.value.trim());
                }
            });
            
            // 初始化标签显示
            renderTags();

            // 保存笔记
            document.getElementById('saveNote').addEventListener('click', function() {
                note.title = document.getElementById('noteTitle').value;
                note.content = quill.root.innerHTML; // 使用innerHTML而不是innerText，以保留HTML格式
                note.date = new Date().toISOString();

                // 更新本地存储
                const updatedNotes = notes.map(n => n.id === noteId ? note : n);
                localStorage.setItem('notes', JSON.stringify(updatedNotes));

                alert('笔记已保存！');
            });

            // 删除笔记
            document.getElementById('deleteNote').addEventListener('click', function() {
                if (confirm('确定要删除这篇笔记吗？此操作不可撤销！')) {
                    const updatedNotes = notes.filter(n => n.id !== noteId);
                    localStorage.setItem('notes', JSON.stringify(updatedNotes));
                    alert('笔记已删除！');
                    window.location.href = 'index.html';
                }
            });
            
            // 导出单个笔记为ZIP格式
            document.getElementById('exportNote').addEventListener('click', function() {
                let noteContent = quill.root.innerHTML; // 使用let以便修改
                const noteTitle = document.getElementById('noteTitle').value || '未命名笔记';
                
                // 创建临时容器处理图片
                const container = document.createElement('div');
                container.innerHTML = noteContent;
                container.style.display = 'none';
                document.body.appendChild(container);
                
                // 查找所有图片元素
                const images = container.querySelectorAll('img');
                const imageFilenames = [];
                
                images.forEach((img, index) => {
                    const src = img.src;
                    // 检查是否是data URL
                    if (src.startsWith('data:')) {
                        // 提取扩展名
                        const mimeMatch = src.match(/^data:image\/([^;]+)/);
                        if (mimeMatch) {
                            const ext = mimeMatch[1].split('+')[0]; // 处理像 image/jpeg;jpeg 这样的情况
                            const filename = `image_${index+1}.${ext}`;
                            imageFilenames.push({ original: src, filename: filename });
                            
                            // 替换内容中的图片引用
                            noteContent = noteContent.replace(src, `./images/${filename}`);
                        }
                    }
                });
                
                // 创建ZIP
                const zip = new JSZip();
                const noteFolder = zip.folder(noteTitle.replace(/[<>:"/\\|?*]/g, '_'));
                
                // 添加图片到images文件夹
                if (imageFilenames.length > 0) {
                    const imagesFolder = noteFolder.folder('images');
                    
                    imageFilenames.forEach(imgInfo => {
                        // 解码data URL并添加到ZIP
                        const base64Data = imgInfo.original.split(',')[1];
                        if (base64Data) {
                            try {
                                const byteCharacters = atob(base64Data);
                                const byteNumbers = new Array(byteCharacters.length);
                                for (let i = 0; i < byteCharacters.length; i++) {
                                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                                }
                                const byteArray = new Uint8Array(byteNumbers);
                                
                                imagesFolder.file(imgInfo.filename, byteArray, { binary: true });
                            } catch (e) {
                                console.error('Error processing image:', imgInfo.filename, e);
                            }
                        }
                    });
                }
                
                // 生成Markdown内容
                const markdownContent = `# ${noteTitle}\n\n创建时间: ${new Date(note.date).toLocaleString()}\n\n${noteContent}`;
                
                // 添加标签信息到导出内容
                if (note.tags && note.tags.length > 0) {
                    markdownContent += `\n\n标签: ${note.tags.join(', ')}`;
                }
                
                // 添加Markdown文件
                noteFolder.file(`${noteTitle.replace(/[<>:"/\\|?*]/g, '_')}.md`, markdownContent);
                
                // 生成并下载ZIP
                zip.generateAsync({ type: 'blob' })
                    .then(function(content) {
                        // 创建下载链接
                        const url = URL.createObjectURL(content);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `${noteTitle.replace(/[<>:"/\\|?*]/g, '_')}_note.zip`;
                        link.click();
                        
                        // 释放URL对象
                        setTimeout(() => {
                            URL.revokeObjectURL(url);
                        }, 100);
                        
                        alert(`笔记已导出为ZIP格式，包含Markdown文件和图片资源。`);
                    });
                
                // 清理临时容器
                document.body.removeChild(container);
            });
            
            // 当标题改变时自动保存
            document.getElementById('noteTitle').addEventListener('input', debounce(function() {
                note.title = this.value;
                updateNoteInStorage();
            }, 1000));
            
            // 标签输入变化时自动保存
            document.getElementById('tagInput').addEventListener('blur', function() {
                if (this.value.trim()) {
                    addTag(this.value.trim());
                }
            });
            
            // 编辑器内容改变时自动保存
            quill.on('text-change', debounce(function(delta, oldDelta, source) {
                if (source === 'user') {
                    note.content = quill.root.innerHTML;
                    updateNoteInStorage();
                }
            }, 1000));
            
            // 防抖函数
            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }
            
            // 更新笔记到存储的辅助函数
            function updateNoteInStorage() {
                const updatedNotes = notes.map(n => n.id === noteId ? note : n);
                localStorage.setItem('notes', JSON.stringify(updatedNotes));
            }
        });
    </script>
</body>
</html>
