<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BKnote - 在线笔记工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>BKnote</h1>
        <p>一个简单易用的在线笔记工具</p>
    </header>

    <main>
        <div class="controls">
            <button id="newNote">新建笔记</button>
            <input type="text" id="searchNotes" placeholder="搜索笔记...">
        </div>

        <div id="notesContainer">
            <!-- 笔记将在这里动态显示 -->
            <div class="note">
                <h3>欢迎使用 BKnote</h3>
                <p>这是一个简单的笔记应用示例。点击"新建笔记"按钮开始记录你的想法。</p>
                <small>创建时间: <span class="date">2026-01-27</span></small>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 BKnote. 所有权利保留.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
